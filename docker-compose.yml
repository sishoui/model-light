version: "3.9"

services:
  db:
    image: mysql:8.4
    command: --max-allowed-packet=1M
    environment:
      MYSQL_DATABASE: modellight
      MYSQL_USER: ml
      MYSQL_PASSWORD: ${DB_PASSWORD:-mlpassword}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 6

  api:
    build: .
    environment:
      DATABASE_URL: mysql://ml:${DB_PASSWORD:-mlpassword}@db:3306/modellight
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: "8080"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]

volumes: { dbdata: {} }
