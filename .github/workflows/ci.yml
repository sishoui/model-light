name: CI

on:
  push:
    branches: [master, spec-implementation, wayfinder/**, e2e/**]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - name: Prisma generate (client types)
        run: npx prisma generate --schema api/prisma/schema.prisma
      - name: Backend e2e (jest)
        run: npm run test:api
      - name: Miniprogram libs (node:test)
        run: npm run test:mini
      - name: Miniprogram libs (vitest)
        run: npm run test:mini:vitest
      - name: Lint
        run: npm run lint

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspaces --include-workspace-root
      - name: Prisma generate (client types)
        run: npx prisma generate --schema api/prisma/schema.prisma
      - name: Build api
        run: npm run build --workspace api
      - name: DI bootstrap smoke (real Nest container)
        env:
          DATABASE_URL: mysql://smoke:smoke@127.0.0.1:1/smoke
        run: BOOTSTRAP_ONLY=1 node api/dist/main.js

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build host tests
        run: |
          for comp in mlarr mlproto mltoken mlrt mlota; do
            if [ -d "firmware/components/$comp/host_tests" ]; then
              cmake -S "firmware/components/$comp/host_tests" -B "build/$comp"
              cmake --build "build/$comp"
              ctest --test-dir "build/$comp" --output-on-failure
            fi
          done

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run host unit tests
        run: python -m pytest host/ -q

  e2e-smoke:
    # E2E 无硬件冒烟：只跑 runner / mock / daemon 的无硬件单测与关键文件检查。
    # 真实 E2E 需要 DevTools + 真机 + COM6，不在 CI 里执行（见 test/e2e/README.md）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (root only, skip api workspace)
        run: |
          npm ci --workspaces=false --include-workspace-root
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: E2E runner + mock unit tests (node:test)
        run: node --test "test/e2e/runner/*.test.js" "test/e2e/mock/*.test.js" "test/e2e/ota-fixture/*.test.js"
      - name: E2E daemon unit tests (pytest)
        run: python -m pytest test/e2e/daemon -q
      - name: Key E2E files present
        run: |
          set -e
          for f in test/e2e/mock/ble-mock.js test/e2e/mock/cloud-mock.js test/e2e/daemon/daemon.py; do
            test -f "$f" || { echo "::error::缺少关键文件 $f"; exit 1; }
          done
          ls test/e2e/cases/*.json >/dev/null || { echo "::error::test/e2e/cases 下没有用例 JSON"; exit 1; }
